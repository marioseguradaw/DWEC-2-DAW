<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <title>Fibonacci Recursivo e Iterativo</title>
    </head>
    <body>
        <h2>Fibonacci Recursivo e Iterativo</h2>

        <label>Introduce un número n (≥ 0): </label>
        <input type="number" id="n" min="0">
        <button type="button" onclick="comparar()">Calcular y comparar</button>

        <div id="resultado" style="margin-top: 15px;"></div>

        <script>
            // Función recursiva
            function fibonacciRecursivo(n) {
                if (n === 0) return 0;
                if (n === 1) return 1;
                return fibonacciRecursivo(n - 1) + fibonacciRecursivo(n - 2);
            }

            // Función iterativa
            function fibonacciIterativo(n) {
                if (n === 0) return 0;
                if (n === 1) return 1;

                let a = 0, b = 1;
                for (let i = 2; i <= n; i++) {
                    let temp = a + b;
                    a = b;
                    b = temp;
                }
                return b;
            }

            // Función principal
            function comparar() {
                const n = parseInt(document.getElementById("n").value);
                const salida = document.getElementById("resultado");

                if (isNaN(n) || n < 0) {
                    salida.innerHTML = "<b>Introduce un número mayor o igual a 0.</b>";
                    return;
                }

                let texto = "";

                // Recursivo (solo si n <= 30 para evitar lentitud)
                if (n <= 30) {
                    console.time("Recursivo");
                    const rec = fibonacciRecursivo(n);
                    console.timeEnd("Recursivo");
                    texto += `<p><b>F(${n}) recursivo:</b> ${rec}</p>`;
                } else {
                    texto += `<p>F(${n}) recursivo no calculado (demasiado grande).</p>`;
                }

                // Iterativo
                console.time("Iterativo");
                const it = fibonacciIterativo(n);
                console.timeEnd("Iterativo");
                texto += `<p><b>F(${n}) iterativo:</b> ${it}</p>`;

                texto += "<br><p><strong>Consulta la consola (F12) para ver los tiempos.</strong></p>";

                salida.innerHTML = texto;
            }
        </script>

        <!-- Prueba de Autoría -->
        <p><br>Autor: Mario Segura Abad<br></p>
        <p>Fecha de realización: 05/10/2025</p>
    </body>
</html>
