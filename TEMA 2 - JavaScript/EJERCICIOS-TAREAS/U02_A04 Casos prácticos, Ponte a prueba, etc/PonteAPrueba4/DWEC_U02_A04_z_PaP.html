<!DOCTYPE html>
<html lang="es">
    <head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Ponte a Prueba 4 - Uso de librerías externas</title>
    </head>
    <body>
		<h1>Uso de librerías externas con Chart</h1>
		<div>
	    	<canvas id="myChart" width="400" height="400"></canvas>
		</div>

		<script type="module">
			// Importar funciones de la librería externa a través del CDN
			import { Chart, LinearScale, BarController, CategoryScale, BarElement }
				from 'https://cdn.jsdelivr.net/npm/chart.js@4.5.1/+esm';

	 		Chart.register(LinearScale, BarController, CategoryScale, BarElement);
	 		const ctx = document.getElementById('myChart');
	 		const myChart = new Chart(ctx, {
	    		type: 'bar',
	     		data: {
		 			labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
		 			datasets: [{
		    			label: '# of Votes',
		     			data: [12, 19, 3, 5, 2, 3],
		     			backgroundColor: [
			 				'rgba(255, 99, 132, 0.2)',
			 				'rgba(54, 162, 235, 0.2)',
			 				'rgba(255, 206, 86, 0.2)',
			 				'rgba(75, 192, 192, 0.2)',
			 				'rgba(153, 102, 255, 0.2)',
			 				'rgba(255, 159, 64, 0.2)'
		     			],
		     			borderColor: [
			 				'rgba(255, 99, 132, 1)',
			 				'rgba(54, 162, 235, 1)',
			 				'rgba(255, 206, 86, 1)',
			 				'rgba(75, 192, 192, 1)',
			 				'rgba(153, 102, 255, 1)',
			 				'rgba(255, 159, 64, 1)'
		     			],
		     			borderWidth: 1
		 			}]
	    		},
	     		options: {
		 			scales: {
		     			y: {
			 				beginAtZero: true
		     			}
		 			}
	     		}
	 		});
		</script>

		<!-- Prueba de Autoría -->
		<p>Autor: Mario Segura Abad<br></p>
		<p>Fecha de realización: 17/10/2025</p>
    </body>
</html>
