                nombre: "David",
                edad: 25,
                permisos: ["administrador", "editor"]
            }

            let cadenaJson = JSON.stringify(usuario);
            // cadenaJson es un string

            let usuarioRecuperado = JSON.parse(cadenaJson);
            // usuarioRecuperado es un objeto
        </script>
