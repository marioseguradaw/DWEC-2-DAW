    <body>
        <h1>Abrir la consola (F12) para ver el resultado</h1>

            // 2.1. Parámetros y variables locales
            function pintar(color="negro") {
                console.log(`Pintando con color ${color}`);
            }

            pintar(); // Pintando con color negro
            pintar("azul"); // Pintando con color azul
            /* pintar("granate"); // Pintando con color granate */
            
            // Hay dos opciones disponibles: llamar a la función pintar() en la consola del navegador (F12)
            // o ir llamando a la función cuantas veces quieras aquí, en el VS Code.
