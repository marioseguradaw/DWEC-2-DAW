<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos - Conexión AIP</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div class="contenedor">
        <header>
            <h1>Gestor de Gastos</h1>
        </header>

        <div id="seccion-login">
            <h3>Bienvenido</h3>
            <p>Introduce tu usuario para cargar tus datos (ej: usuario1)</p>
            <div class="form-grupo">
                <input type="text" id="inputUsuario" placeholder="Nombre de usuario">
                <button id="btnCargarUsuario">Entrar</button>
            </div>
        </div>

        <div id="seccion-app" style="display: none;">
            <div class="info-usuario">
                <p>Usuario: <strong id="nombreUsuarioDisplay">----</strong></p>
                <button id="btnSalir" class="btn-secundario">Cambiar Usuario</button>
            </div>

            <div class="caja-formulario">
                <h3>Añadir Nuevo Gasto</h3>
                <form id="formulario-gasto">
                    <div class="campo">
                        <label for="concepto">Descripción:</label>
                        <input type="text" id="concepto" placeholder="Ej: Compra supermercado" required>
                    </div>
                    <div class="campo">
                        <label for="cantidad">Valor (€):</label>
                        <input type="number" id="cantidad" placeholder="0.00" step="0.01" required>
                    </div>
                    <div class="campo">
                        <label>Valor (€):</label>
                        <input type="number" id="cantidad" placeholder="0.00" step="0.01" required>
                    </div>
                    <button type="submit" class="btn-primario">Guardar Gasto</button>
                </form>
            </div>

            <div class="caja-listado">
                <h3>Mis Gastos</h3>
                <ul id="lista-gastos"></ul>
            </div>
        </div>
    </div>

    <script src="js/gestionPresupuesto.js"></script>
</body>

</html>
