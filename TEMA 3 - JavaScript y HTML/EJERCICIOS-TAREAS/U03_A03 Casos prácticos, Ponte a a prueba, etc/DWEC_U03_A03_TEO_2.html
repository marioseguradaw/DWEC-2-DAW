<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3.1. Interacción con formularios</title>
    </head>
    <body>
        <form name="encuesta">
            <div>
                Indica tu edad:
                <input name="edad" type="radio" value="menor20">
                <input name="edad" type="radio" value="mayor20" checked>
            </div>
            <div>
                Selecciona tus opciones de suscripción:
                <input name="suscripcion" type="checkbox" value="javascript" checked>
                <input name="suscripcion" type="checkbox" value="java">
                <input name="suscripcion" type="checkbox" value="go" checked>
            </div>
        </form>

        <script>
            let formEncuesta = document.forms.encuesta;

            let elemsEdad = formEncuesta.elements.edad;
            console.log(elemsEdad[0]); // Elemento <input name="edad" type="radio" value="menor20">
            console.log(elemsEdad[1]); // Elemento <input name="edad" type="radio" value="mayor20" checked>

            console.log(elemsEdad.value); // mayor20
            console.log(elemsEdad[0].checked); // false
            console.log(elemsEdad[1].checked); // true

            // Activamos la primera opción desde JavaScript
            elemsEdad[0].checked = true;
            // Comprobamos los cambios
            console.log(elemsEdad.value); // menor20
            console.log(elemsEdad[0].checked); // true
            console.log(elemsEdad[1].checked); // false

            let elemsSuscripcion = formEncuesta.elements.suscripcion;
            console.log(elemsSuscripcion[0]); // Elemento <input name="suscripcion" type="checkbox" value="javascript" checked>
            console.log(elemsSuscripcion[1]); // Elemento <input name="suscripcion" type="checkbox" value="go" checked>

            console.log(elemsSuscripcion.value); // "" (cadena vacía)
            console.log(elemsSuscripcion[0].checked); // true
            console.log(elemsSuscripcion[1].checked); // false
            console.log(elemsSuscripcion[2].checked); // true
        </script>

        <!-- Prueba de autoría -->
        <br><br><p>Autor: <strong>Mario Segura Abad</strong></p>
        <p>Fecha de realización: 04/12/2025</p>
    </body>
</html>
