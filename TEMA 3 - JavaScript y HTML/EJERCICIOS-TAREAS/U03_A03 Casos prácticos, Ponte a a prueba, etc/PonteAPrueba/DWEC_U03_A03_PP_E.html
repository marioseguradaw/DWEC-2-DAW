<!DOCTYPE html>
<html lang="es">
    <head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Unidad 3 - Ponte a Prueba</title>
    </head>
    <body>
		<h1>Formulario de contacto</h1>
		<form name="form1">
	    	<div>
				<label for="nombre">Nombre</label>
				<input id="nombre" name="nombre" type="text">
	    	</div>
	    	<div>
				<label for="apellidos">Apellidos</label>
				<input id="apellidos" name="apellidos" type="text">
	    	</div>
	    	<div>
				<label for="email">Email</label>
				<input id="email" name="email" type="text">
	    	</div>
	    	<div>
				<label for="telefono">Teléfono</label>
				<input id="telefono" name="telefono" type="text">
	    	</div>
	    	<div>
				Edad:
				<label for="menor30">Menos de 30</label>
				<input id="menor30" name="edad" type="radio" value="menor30">
				<label for="entre3050">Entre 30 y 50</label>
				<input id="entre3050" name="edad" type="radio" value="entre3050">
				<label for="mayor50">Más de 50</label>
				<input id="mayor50" name="edad" type="radio" value="mayor50">
	    	</div>
	    	<div>
				<button type="submit">Enviar</button>
	    	</div>
		</form>
		<script>
			document.forms.form1.addEventListener("submit", function(evento){
				// Evita el envío real del formulario
				evento.preventDefault();

				// Capturar los valores del formulario
				let nombre = document.getElementById("nombre").value;
				let apellidos = document.getElementById("apellidos").value;
				let email = document.getElementById("email").value;
				let telefono = document.getElementById("telefono").value;

				// Radio seleccionado
				let edadSeleccionada = document.querySelector("input[name='edad']:checked");
				let edad = edadSeleccionada ? edadSeleccionada.value : "No seleccionada";

				// Mostrar los valores en un alert
				alert(
					"Nombre: " + nombre + "\n" +
					"Apellidos: " + apellidos + "\n" +
					"Email: " + email + "\n" +
					"Teléfono: " + telefono + "\n" +
					"Edad: " + edad
				);
			});
		</script>

		<!-- Prueba de autoría -->
		<br><br><p>Autor: <strong>Mario Segura Abad</strong></p>
		<p>Fecha de realización: 04/12/2025</p>
    </body>
</html>
