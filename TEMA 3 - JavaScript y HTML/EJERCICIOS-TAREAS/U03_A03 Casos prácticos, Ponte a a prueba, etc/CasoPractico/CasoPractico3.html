<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Caso Práctico 3 – Validación de formulario</title>
    </head>
    <body>
        <h1>Formulario con validación de NIF/NIE</h1>

        <form id="formDatos">
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="apellidos">Apellidos:</label><br>
            <input type="text" id="apellidos" name="apellidos" required><br><br>

            <label for="nif">NIF / NIE:</label><br>
            <input type="text" id="nif" name="nif" required><br><br>

            <button type="submit">Enviar</button>
        </form>

        <script>
            // ====== Función del archivo DWEC_U03_A03_CP_E.js ======
            function comprobarNifNie(nif) {
                var letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T'];

                let nifMay = nif.toUpperCase();
                let primeraLetra = nifMay.substr(0,1);
                let letraNIF = nifMay.substring(8, 9);
                let numNIF;

                if (isNaN(primeraLetra)) {
                    switch (primeraLetra) {
                        case "X": 
                            numNIF = "0";
                            break;
                        case "Y":
                            numNIF = "1";
                            break;
                        case "Z":
                            numNIF = "2";
                            break;
                        default:
                    }
                    numNIF += nifMay.substring(1,8);
                } else {
                    numNIF = nifMay.substring(0,8);
                }

                numNIF = parseInt(numNIF);
                let letraCalculada = letras[numNIF % 23];

                return letraCalculada === letraNIF;
            }

            // ====== Validación del formulario ======
            document.getElementById("formDatos").addEventListener("submit", function(evento) {

                // Evitar envío real
                evento.preventDefault();

                const campoNif = document.getElementById("nif").value;

                // Validar NIF/NIE con la función del archivo proporcionado
                if (!comprobarNifNie(campoNif)) {
                    alert("El NIF/NIE introducido no es válido.");
                    return; // se detiene
                }

                // Si es válido → éxito
                alert("Formulario enviado correctamente (simulación).");
            });
        </script>

        <!-- Prueba de autoría -->
        <br><br><p>Autor: <strong>Mario Segura Abad</strong></p>
        <p>Fecha de realización: 04/12/2025</p>
    </body>
</html>
