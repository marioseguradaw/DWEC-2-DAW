<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2.1. Eventos: tipos</title>
    </head>
    <body>
        <button id="boton">Pulsa el botón</button>

        <script>
            function saludar1() {
                alert("Hola Mundo!");
            }

            function saludar2() {
                alert("Hola otra vez!");
            }

            let boton = document.getElementById("boton");
            boton.addEventListener("click", saludar1);

            // Se puede añadir un segundo manejador de eventos, que se ejecutará tras el anterior
            boton.addEventListener("click", saludar2);
        </script>

        <!-- Prueba de Autoría -->
        <br><br><p>Autor: <strong>Mario Segura Abad</strong></p>
        <p>Fecha de realización: 15/11/2025</p>
    </body>
</html>
