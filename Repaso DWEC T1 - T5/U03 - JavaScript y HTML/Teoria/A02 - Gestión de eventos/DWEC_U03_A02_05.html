<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DWEC_U03_A02_05</title>
    </head>
    <body>
        <button id="boton">Pulsa el botón</button>

        <script>
            function saludar(evento) {
                console.log(`El evento se ha producido sobre el objeto ${this}`);
                console.log(`Evento de tipo ${evento.type} sobre el elemento ${evento.currentTarget} .`);
            }

            let boton = document.getElementById("boton");
            boton.addEventListener("click", saludar);
        </script>
