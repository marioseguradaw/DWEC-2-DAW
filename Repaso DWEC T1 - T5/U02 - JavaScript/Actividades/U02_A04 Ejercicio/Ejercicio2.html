<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Juego de suma</title>
        <style>
            .juego-container {
                font-family: 'Times New Roman', Times, serif;
                font-size: 24px;
                margin-top: 30px;
            }
            .input-respuesta {
                font-size: 20px;
                width: 250px;
                padding: 2px 5px;
            }
            .btn-comprobar {
                font-size: 20px;
                padding: 2px 10px;
                margin-left: 10px;
                background-color: #f0f0f0;
                border: 1px solid #7a7a7a;
                border-radius: 3px;
                cursor: pointer;
            }
            .resultado {
                margin-top: 5px;
                font-size: 22px;
            }
        </style>
    </head>
    <body>
        <div class="juego-container">
            <div id="enunciado">Suma 0 + 0</div>
            <div style="margin-top: 10px;">
                <input type="number" id="txtRespuesta" class="input-respuesta">
                <button id="botonComprobar" class="btn-comprobar">Comprobar</button>
            </div>
            <div id="txtResultado" class="resultado"></div>
            <div id="txtTiempo" class="resultado"></div>
        </div>

        <script>
            // Variables globales del juego
            let numero1 = 0;
            let numero2 = 0;
            let resultadoCorrecto = 0;
            let tiempoInicio = null;

            const enunciado = document.getElementById('enunciado');
            const txtRespuesta = document.getElementById('txtRespuesta');
            const botonComprobar = document.getElementById('botonComprobar');
            const txtResultado = document.getElementById('txtResultado');
            const txtTiempo = document.getElementById('txtTiempo');

            // Inicializar juego
            function iniciarJuego() {
                // Generar números aleatorios entre 0 y 99
                numero1 = Math.floor(Math.random() * 100);
                numero2 = Math.floor(Math.random() * 100);
                resultadoCorrecto = numero1 + numero2;

                // Mostrar enunciado
                enunciado.textContent = `Suma ${numero1} + ${numero2}`;

                // Guardar la marca de tiempo exacta de inicio
                tiempoInicio = Date.now();
            }

            // Comprobar la respuesta
            botonComprobar.addEventListener('click', () => {
                const respuestaUsuario = parseInt(txtRespuesta.value);

                if (respuestaUsuario === resultadoCorrecto) {
                    // Calcular tiempo transcurrido
                    const tiempoFin = Date.now();
                    const diferenciaMiliSegundos = tiempoFin - tiempoInicio;

                    // Formatear a segundos y centésimas (Ej: 02:56 s)
                    const totalSegundos = Math.floor(diferenciaMiliSegundos / 1000);
                    const centesimas = Math.floor((diferenciaMiliSegundos % 1000) / 10);

                    let s = String(totalSegundos).padStart(2, '0');
                    let c = String(centesimas).padStart(2, '0');

                    txtResultado.textContent = "Correcto";
                    txtTiempo.textContent = `Has tardado:${s}:${c} s`;
                } else {
                    txtResultado.textContent = "Incorrecto";
                    txtTiempo.textContent = ""; // No se muestra el tiempo si falla
                }
            });

            // Arrancar el juego al cargar la pagina
            window.onload = iniciarJuego;   
        </script>
    </body>
</html>
