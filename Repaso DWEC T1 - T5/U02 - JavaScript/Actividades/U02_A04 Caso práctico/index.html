        <h1>Caso Práctico 4: Módulos activos</h1>

        <script type="module">
            import { Enemigo, Orco, Troll } from './enemigos.js';

            // Creación de un enemigo de cada tipo
            const enemigoComun = new Enemigo();
            const orcoSalvaje = new Orco();
            const trollGiganteYPeludo = new Troll();

            // Demostración en consola de que funcionan correctamente
            console.log("---- Instancia de Enemigo ----");
            console.log("Energía:", enemigoComun.energia);
            enemigoComun.mover();

            console.log("\n---- Instancia de Orco ----");
            console.log("Energía:", orcoSalvaje.energia);
            console.log("Fuerza:", orcoSalvaje.fuerza);
            orcoSalvaje.mover();
            orcoSalvaje.disparar();

            console.log("\n---- Instancia de Troll ----");
            console.log("Energía:", trollGiganteYPeludo.energia);
            console.log("Fuerza:", trollGiganteYPeludo.fuerza);
            trollGiganteYPeludo.mover();
            trollGiganteYPeludo.golpear();
        </script>
